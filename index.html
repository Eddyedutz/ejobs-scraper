<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analiza Pieței Muncii - eJobs</title>
  
  <!-- Tailwind CSS for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
  
  <!-- Babel to compile JSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Recharts & Dependencies -->
  <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.1.12/umd/Recharts.js"></script>
</head>
<body class="bg-slate-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const { XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Area, AreaChart } = window.Recharts;

    // --- Lightweight Icons (Replaced Lucide React imports for single HTML compatibility) ---
    const Icon = ({ children, size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {children}
      </svg>
    );
    const Briefcase = (p) => <Icon {...p}><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></Icon>;
    const Activity = (p) => <Icon {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></Icon>;
    const AlertCircle = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></Icon>;
    const Database = (p) => <Icon {...p}><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></Icon>;
    const TrendingUp = (p) => <Icon {...p}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></Icon>;
    const TrendingDown = (p) => <Icon {...p}><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"></polyline><polyline points="17 18 23 18 23 12"></polyline></Icon>;
    const Minus = (p) => <Icon {...p}><line x1="5" y1="12" x2="19" y2="12"></line></Icon>;
    const Calendar = (p) => <Icon {...p}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></Icon>;
    const BarChart2 = (p) => <Icon {...p}><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></Icon>;
    const ChevronLeft = (p) => <Icon {...p}><polyline points="15 18 9 12 15 6"></polyline></Icon>;
    const ChevronRight = (p) => <Icon {...p}><polyline points="9 18 15 12 9 6"></polyline></Icon>;

    // Calea directă către CSV - funcționează deoarece ambele fișiere sunt în același repository acum!
    const DATA_URL = './ejobs_data.csv';

    const timeframeLabels = {
      daily: 'Zilnic',
      weekly: 'Săptămânal',
      monthly: 'Lunar'
    };

    const CustomTooltip = ({ active, payload }) => {
      if (active && payload && payload.length) {
        const pData = payload[0].payload;
        const isPos = pData.diff > 0;
        return (
          <div className="bg-white p-4 rounded-lg shadow-lg border border-slate-100 min-w-[180px]">
            <p className="text-slate-500 text-sm mb-2">{pData.originalDate}</p>
            <div className="flex items-baseline gap-2">
              <p className="text-blue-600 font-bold text-xl">{pData.value.toLocaleString('ro-RO')}</p>
              <span className="text-sm font-medium text-slate-500">joburi (medie)</span>
            </div>
            {pData.diff !== 0 && (
              <div className={`flex items-center gap-1 mt-2 text-sm font-semibold ${isPos ? 'text-green-600' : 'text-red-600'} bg-slate-50 p-2 rounded-md`}>
                {isPos ? <TrendingUp size={16} /> : <TrendingDown size={16} />}
                <span>
                  {isPos ? '+' : ''}{pData.diff.toLocaleString('ro-RO')} ({isPos ? '+' : ''}{pData.diffPercent}%)
                </span>
              </div>
            )}
          </div>
        );
      }
      return null;
    };

    function App() {
      const [rawData, setRawData] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      
      const [timeframe, setTimeframe] = useState('daily');
      const [currentPage, setCurrentPage] = useState(1);
      const [itemsPerPage, setItemsPerPage] = useState(10);

      const parseCSV = (text) => {
        const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
        if (lines.length < 2) throw new Error("CSV-ul trebuie să conțină cel puțin un antet și un rând de date.");

        const rawHeaders = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
        let dateColIdx = 0;
        let valColIdx = 1;

        rawHeaders.forEach((h, i) => {
          const lowerH = h.toLowerCase();
          if (lowerH.includes('date') || lowerH.includes('time') || lowerH.includes('day')) dateColIdx = i;
          if (lowerH.includes('job') || lowerH.includes('count') || lowerH.includes('total') || lowerH.includes('available') || lowerH.includes('value')) valColIdx = i;
        });

        const parsedData = [];
        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || lines[i].split(',');
          if (cols.length >= Math.max(dateColIdx, valColIdx) + 1) {
            const rawDate = cols[dateColIdx]?.trim().replace(/^"|"$/g, '');
            const rawVal = cols[valColIdx]?.trim().replace(/^"|"$/g, '');
            const numVal = parseFloat(rawVal);
            
            if (rawDate && !isNaN(numVal)) {
              parsedData.push({
                originalDate: rawDate,
                timestamp: new Date(rawDate).getTime(),
                value: numVal,
              });
            }
          }
        }
        return parsedData.sort((a, b) => a.timestamp - b.timestamp);
      };

      const loadData = async () => {
        setLoading(true);
        setError(null);
        try {
          const response = await fetch(DATA_URL);
          if (!response.ok) throw new Error(`Eroare la preluarea datelor (Status: ${response.status}).`);
          const csvText = await response.text();
          const parsedData = parseCSV(csvText);
          if (parsedData.length === 0) throw new Error("Nu s-au putut extrage date valide din CSV.");
          setRawData(parsedData);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        loadData();
      }, []);

      const processedData = useMemo(() => {
        if (rawData.length === 0) return [];

        let aggregated = [];

        if (timeframe === 'daily') {
          aggregated = [...rawData];
        } else {
          const groups = {};
          rawData.forEach(item => {
            const dateObj = new Date(item.timestamp);
            let key, label;
            
            if (timeframe === 'weekly') {
              const day = dateObj.getDay();
              const diff = dateObj.getDate() - day + (day === 0 ? -6 : 1);
              const weekStart = new Date(dateObj.setDate(diff));
              key = weekStart.toISOString().split('T')[0];
              label = `Săpt. ${weekStart.toLocaleDateString('ro-RO', { month: 'short', day: 'numeric' })}`;
            } else if (timeframe === 'monthly') {
              key = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}`;
              label = dateObj.toLocaleDateString('ro-RO', { month: 'long', year: 'numeric' });
            }

            if (!groups[key]) {
              groups[key] = { label, timestamp: new Date(key).getTime(), values: [] };
            }
            groups[key].values.push(item.value);
          });

          aggregated = Object.values(groups).map(g => ({
            originalDate: g.label,
            timestamp: g.timestamp,
            value: Math.round(g.values.reduce((sum, val) => sum + val, 0) / g.values.length)
          })).sort((a, b) => a.timestamp - b.timestamp);
        }

        return aggregated.map((item, index, arr) => {
          if (index === 0) return { ...item, diff: 0, diffPercent: 0 };
          const prevItem = arr[index - 1];
          const diff = item.value - prevItem.value;
          const diffPercent = prevItem.value !== 0 ? parseFloat(((diff / prevItem.value) * 100).toFixed(1)) : 0;
          return { ...item, diff, diffPercent };
        });
      }, [rawData, timeframe]);

      useEffect(() => {
        setCurrentPage(1);
      }, [processedData, itemsPerPage]);

      const metrics = useMemo(() => {
        if (processedData.length === 0) return null;
        const latest = processedData[processedData.length - 1];
        const oldest = processedData[0].value;
        
        const avgVolume = Math.round(processedData.reduce((sum, d) => sum + d.value, 0) / processedData.length);
        
        const recentPeriods = processedData.slice(-3);
        const momentum = recentPeriods.length >= 2 
          ? recentPeriods[recentPeriods.length - 1].value - recentPeriods[0].value 
          : 0;

        const overallGrowth = latest.value - oldest;
        const overallGrowthPercent = oldest !== 0 ? ((overallGrowth / oldest) * 100).toFixed(1) : 0;

        return { 
          latest: latest.value, 
          latestDiff: latest.diff,
          latestDiffPercent: latest.diffPercent,
          avgVolume,
          momentum,
          overallGrowth, 
          overallGrowthPercent 
        };
      }, [processedData]);

      const reversedData = useMemo(() => [...processedData].reverse(), [processedData]);
      const totalPages = Math.ceil(reversedData.length / itemsPerPage);
      const currentTableData = reversedData.slice(
        (currentPage - 1) * itemsPerPage, 
        currentPage * itemsPerPage
      );

      return (
        <div className="min-h-screen text-slate-900 font-sans p-4 md:p-8">
          <div className="max-w-7xl mx-auto space-y-6">
            
            <header className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
              <div className="flex items-center gap-4">
                <div className="p-3 bg-blue-50 text-blue-600 rounded-xl">
                  <Briefcase size={28} />
                </div>
                <div>
                  <h1 className="text-2xl font-bold text-slate-800">Analiza Pieței Muncii</h1>
                  <p className="text-slate-500 text-sm">Monitorizarea tendințelor cu date preluate de pe pagina principală eJobs</p>
                </div>
              </div>
              
              <div className="flex bg-slate-100 p-1 rounded-lg">
                {['daily', 'weekly', 'monthly'].map((tf) => (
                  <button
                    key={tf}
                    onClick={() => setTimeframe(tf)}
                    className={`px-4 py-2 text-sm font-medium rounded-md transition-all ${
                      timeframe === tf 
                        ? 'bg-white text-blue-600 shadow-sm' 
                        : 'text-slate-500 hover:text-slate-700 hover:bg-slate-200/50'
                    }`}
                  >
                    {timeframeLabels[tf]}
                  </button>
                ))}
              </div>
            </header>

            {loading && (
              <div className="flex items-center justify-center p-12 text-blue-600">
                <Activity className="animate-spin" size={32} />
                <span className="ml-3 font-medium">Se procesează datele...</span>
              </div>
            )}

            {error && !loading && (
              <div className="bg-red-50 text-red-700 p-4 rounded-xl flex items-start gap-3 border border-red-100">
                <AlertCircle className="shrink-0 mt-0.5" size={18} />
                <div>
                  <h3 className="font-semibold text-sm">Eroare la încărcarea datelor</h3>
                  <p className="text-sm opacity-90 mt-1">{error}</p>
                </div>
              </div>
            )}

            {!loading && !error && processedData.length > 0 && metrics && (
              <div className="space-y-6">
                
                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <div className="flex items-center gap-2 text-slate-500 mb-2">
                      <Database size={16} />
                      <h3 className="text-sm font-medium">Joburi Active (Curent)</h3>
                    </div>
                    <p className="text-3xl font-bold text-slate-800">{metrics.latest.toLocaleString('ro-RO')}</p>
                    <div className="mt-2 flex items-center gap-1.5 text-xs text-slate-500">
                      <span className={`flex items-center font-semibold px-1.5 py-0.5 rounded ${metrics.latestDiff > 0 ? 'bg-green-100 text-green-700' : metrics.latestDiff < 0 ? 'bg-red-100 text-red-700' : 'bg-slate-100 text-slate-600'}`}>
                        {metrics.latestDiff > 0 ? '+' : ''}{metrics.latestDiff.toLocaleString('ro-RO')} ({metrics.latestDiff > 0 ? '+' : ''}{metrics.latestDiffPercent}%)
                      </span>
                      vs ant.
                    </div>
                  </div>

                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <div className="flex items-center gap-2 text-slate-500 mb-2">
                      <BarChart2 size={16} />
                      <h3 className="text-sm font-medium">Media Istorică</h3>
                    </div>
                    <p className="text-3xl font-bold text-slate-800">{metrics.avgVolume.toLocaleString('ro-RO')}</p>
                    <p className="text-sm text-slate-400 mt-2">Nivelul de bază al pieței</p>
                  </div>
                  
                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <div className="flex items-center gap-2 text-slate-500 mb-2">
                      <Activity size={16} />
                      <h3 className="text-sm font-medium">Evoluție Recentă</h3>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <p className="text-3xl font-bold text-slate-800">
                        {metrics.momentum > 0 ? '+' : ''}{metrics.momentum.toLocaleString('ro-RO')}
                      </p>
                    </div>
                    <p className="text-sm text-slate-400 mt-2">Diferența netă (ultimele 3 per.)</p>
                  </div>

                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <div className="flex items-center gap-2 text-slate-500 mb-2">
                      <TrendingUp size={16} />
                      <h3 className="text-sm font-medium">Creștere Totală</h3>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <p className="text-3xl font-bold text-slate-800">
                        {metrics.overallGrowth > 0 ? '+' : ''}{metrics.overallGrowth.toLocaleString('ro-RO')}
                      </p>
                      <span className={`text-sm font-medium px-2 py-0.5 rounded-md ${metrics.overallGrowth >= 0 ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                        {metrics.overallGrowthPercent}%
                      </span>
                    </div>
                    <p className="text-sm text-slate-400 mt-2">De la începutul măsurătorilor</p>
                  </div>
                </div>

                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                  <div className="flex items-center justify-between mb-6">
                    <div>
                      <h2 className="text-lg font-bold text-slate-800">Tendința Cererii de Personal</h2>
                      <p className="text-sm text-slate-500">Afișare date ({timeframeLabels[timeframe].toLowerCase()}) și variația față de perioada anterioară</p>
                    </div>
                    <span className="text-xs font-medium bg-slate-100 text-slate-600 px-3 py-1 rounded-full flex items-center gap-1">
                      <Calendar size={12}/> {processedData.length} Perioade
                    </span>
                  </div>
                  <div className="h-[350px] w-full">
                    <ResponsiveContainer width="100%" height="100%">
                      <AreaChart data={processedData} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
                        <defs>
                          <linearGradient id="colorValue" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="5%" stopColor="#2563eb" stopOpacity={0.3}/>
                            <stop offset="95%" stopColor="#2563eb" stopOpacity={0}/>
                          </linearGradient>
                        </defs>
                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                        <XAxis 
                          dataKey="originalDate" 
                          axisLine={false}
                          tickLine={false}
                          tick={{ fill: '#64748b', fontSize: 12 }}
                          dy={10}
                          minTickGap={40}
                        />
                        <YAxis 
                          axisLine={false}
                          tickLine={false}
                          tick={{ fill: '#64748b', fontSize: 12 }}
                          domain={['auto', 'auto']}
                          tickFormatter={(val) => val.toLocaleString('ro-RO')}
                        />
                        <Tooltip content={<CustomTooltip />} />
                        <Area 
                          type="monotone" 
                          dataKey="value" 
                          stroke="#2563eb" 
                          strokeWidth={3}
                          fillOpacity={1} 
                          fill="url(#colorValue)" 
                          activeDot={{ r: 6, fill: '#1d4ed8', stroke: '#fff', strokeWidth: 2 }}
                        />
                      </AreaChart>
                    </ResponsiveContainer>
                  </div>
                </div>

                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex flex-col">
                  <div className="p-5 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                      <h2 className="text-lg font-bold text-slate-800">Date Complete</h2>
                      <p className="text-sm text-slate-500">Înregistrări agregate ({timeframeLabels[timeframe].toLowerCase()})</p>
                    </div>
                    
                    <div className="flex items-center gap-2 text-sm text-slate-600">
                      <label htmlFor="pageSize">Afișează:</label>
                      <select 
                        id="pageSize"
                        value={itemsPerPage} 
                        onChange={(e) => setItemsPerPage(Number(e.target.value))}
                        className="bg-slate-50 border border-slate-200 text-slate-700 rounded-md py-1.5 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                      >
                        <option value={10}>10 rânduri</option>
                        <option value={20}>20 rânduri</option>
                        <option value={50}>50 rânduri</option>
                      </select>
                    </div>
                  </div>
                  
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm whitespace-nowrap">
                      <thead className="bg-slate-50 text-slate-500 font-medium">
                        <tr>
                          <th className="px-6 py-3.5">Perioadă Timp</th>
                          <th className="px-6 py-3.5">Medie Joburi Disponibile</th>
                          <th className="px-6 py-3.5">Schimbare vs Anterior</th>
                          <th className="px-6 py-3.5">Variație %</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {currentTableData.map((row, idx) => (
                          <tr key={idx} className="hover:bg-slate-50/80 transition-colors">
                            <td className="px-6 py-4 font-medium text-slate-700">
                              {row.originalDate}
                            </td>
                            <td className="px-6 py-4 font-semibold text-slate-800">
                              {row.value.toLocaleString('ro-RO')}
                            </td>
                            <td className="px-6 py-4">
                              {row.diff !== 0 ? (
                                <span className={`flex items-center gap-1.5 font-medium ${row.diff > 0 ? 'text-green-600' : 'text-red-600'}`}>
                                  {row.diff > 0 ? <TrendingUp size={15} /> : <TrendingDown size={15} />}
                                  {row.diff > 0 ? '+' : ''}{row.diff.toLocaleString('ro-RO')}
                                </span>
                              ) : (
                                <span className="text-slate-400 font-medium flex items-center gap-1.5">
                                  <Minus size={15} /> 0
                                </span>
                              )}
                            </td>
                            <td className="px-6 py-4">
                              {row.diff !== 0 ? (
                                <span className={`inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold ${row.diff > 0 ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'}`}>
                                  {row.diffPercent > 0 ? '+' : ''}{row.diffPercent}%
                                </span>
                              ) : (
                                <span className="text-slate-400">-</span>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  <div className="p-4 border-t border-slate-100 flex items-center justify-between bg-slate-50/50">
                    <span className="text-sm text-slate-500">
                      Se afișează de la <span className="font-medium text-slate-700">{((currentPage - 1) * itemsPerPage) + 1}</span> la <span className="font-medium text-slate-700">{Math.min(currentPage * itemsPerPage, reversedData.length)}</span> din <span className="font-medium text-slate-700">{reversedData.length}</span> înregistrări
                    </span>
                    
                    <div className="flex items-center gap-1">
                      <button 
                        onClick={() => setCurrentPage(p => Math.max(1, p - 1))}
                        disabled={currentPage === 1}
                        className="p-1.5 rounded-md text-slate-500 hover:bg-slate-200 disabled:opacity-30 disabled:hover:bg-transparent transition-colors"
                      >
                        <ChevronLeft size={18} />
                      </button>
                      <div className="flex items-center gap-1 px-2 text-sm">
                        <span className="font-medium text-slate-700">{currentPage}</span>
                        <span className="text-slate-400">/</span>
                        <span className="text-slate-500">{totalPages}</span>
                      </div>
                      <button 
                        onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))}
                        disabled={currentPage === totalPages || totalPages === 0}
                        className="p-1.5 rounded-md text-slate-500 hover:bg-slate-200 disabled:opacity-30 disabled:hover:bg-transparent transition-colors"
                      >
                        <ChevronRight size={18} />
                      </button>
                    </div>
                  </div>
                </div>

              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
